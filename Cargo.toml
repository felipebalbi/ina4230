[package]
name = "ina4230"
version = "0.1.0"
repository = "https://github.com/OpenDevicePartnership/ina4230"
license = "MIT"
description = "Platform-agnostic Rust driver for the Texas Instruments INA4230 quad-channel power and energy sense monitor."
readme = "README.md"
keywords = ["TI", "power-monitor", "energy", "driver", "embedded-hal-driver"]
categories = ["embedded", "hardware-support", "no-std"]
documentation = "https://docs.rs/ina4230"
include = ["/**/*.rs", "/Cargo.toml", "/README.md", "/LICENSE", "/INA4230.toml"]
edition = "2024"
rust-version = "1.88"

[dependencies]
device-driver = "2.1.0"
defmt = { version = "1.0", optional = true }
embedded-hal-async = "1.0.0"
embedded-sensors-hal-async = "0.4.0"

[dev-dependencies]
embedded-hal-mock = { version = "0.11.1", features = ["embedded-hal-async"] }
tokio = { version = "=1.45.0", features = ["rt", "macros"] }


[lints.rust]
unsafe_code = "deny"
missing_docs = "deny"

[lints.clippy]
correctness = "forbid"
suspicious = "forbid"
perf = "forbid"
style = "forbid"
pedantic = "deny"

[features]
defmt = ["dep:defmt", "device-driver/defmt", "embedded-sensors-hal-async/defmt"]
