[package]
name = "ina4230"
version = "0.1.0"
repository = "https://github.com/OpenDevicePartnership/ina4230"
license = "MIT"
description = "Platform-agnostic Rust driver for the Texas Instruments INA4230 quad-channel power and energy sense monitor."
readme = "README.md"
keywords = ["TI", "power-monitor", "energy", "driver", "embedded-hal-driver"]
categories = ["embedded", "hardware-support", "no-std"]
documentation = "https://docs.rs/ina4230"
include = ["/**/*.rs", "/Cargo.toml", "/README.md", "/LICENSE", "/INA4230.ddsl"]
edition = "2024"
# Bounded by device-driver 2.1, which requires 1.94.
rust-version = "1.94"

[dependencies]
device-driver = "2.1.0"
defmt = { version = "1.0", optional = true }
embedded-hal-async = "1.0.0"
embedded-sensors-hal-async = "0.4.0"

[dev-dependencies]
embedded-hal-mock = { version = "0.11.1", features = ["embedded-hal-async"] }
proptest = "1.6"
tokio = { version = "=1.45.0", features = ["rt", "macros"] }


[lints.rust]
unsafe_code = "deny"
missing_docs = "deny"

[lints.clippy]
# `deny` rather than `forbid`: `forbid` cannot be relaxed by an `allow`
# anywhere in the crate, including inside code expanded from dependency
# macros and inside the generated `device` module. rustc already warns that
# such a conflict "will become a hard error in a future release". `deny` is
# equally strict for our own code.
correctness = "deny"
suspicious = "deny"
perf = "deny"
style = "deny"
pedantic = "deny"

[features]
defmt = ["dep:defmt", "device-driver/defmt", "embedded-sensors-hal-async/defmt"]
