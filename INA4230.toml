[config]
register_address_type = "u8"
default_byte_order = "BE"
name_word_boundaries = ["Hyphen"]
defmt_feature = "defmt"
# ============================================================
# CONFIG1 Register (Address = 0x20, Reset = 0xF127)
# ============================================================

[config1]
type = "register"
address = 0x20
size_bits = 16
access = "RW"
reset_value = 0xF127
description = "Configuration register 1"

[config1.fields.active-channel]
description = "Active channel enable bits. Bit15=CH4, Bit14=CH3, Bit13=CH2, Bit12=CH1"
base = "uint"
start = 12
end = 16

[config1.fields.avg]
description = "Number of ADC conversion results to average"
base = "uint"
start = 9
end = 12

[config1.fields.avg.conversion]
name = "averaging"
description = "Averaging count"
_1 = 0
_4 = 1
_16 = 2
_64 = 3
_128 = 4
_256 = 5
_512 = 6
_1024 = 7

[config1.fields.vbusct]
description = "Bus voltage conversion time"
base = "uint"
start = 6
end = 9

[config1.fields.vbusct.conversion]
name = "bus-conversion-time"
description = "Bus voltage conversion time"
_140-us = 0
_204-us = 1
_332-us = 2
_588-us = 3
_1100-us = 4
_2116-us = 5
_4156-us = 6
_8244-us = 7

[config1.fields.vshct]
description = "Shunt voltage conversion time"
base = "uint"
start = 3
end = 6

[config1.fields.vshct.conversion]
name = "shunt-conversion-time"
description = "Shunt voltage conversion time"
_140-us = 0
_204-us = 1
_332-us = 2
_588-us = 3
_1100-us = 4
_2116-us = 5
_4156-us = 6
_8244-us = 7

[config1.fields.mode]
description = "Operating mode"
base = "uint"
start = 0
end = 3

[config1.fields.mode.conversion]
name = "mode"
description = "Operating mode"
shutdown = 0
shunt-triggered = 1
bus-triggered = 2
shunt-and-bus-triggered = 3
shutdown-2 = 4
continuous-shunt = 5
continuous-bus = 6
continuous-shunt-and-bus = 7

# ============================================================
# CONFIG2 Register (Address = 0x21, Reset = 0x0000)
# ============================================================

[config2]
type = "register"
address = 0x21
size_bits = 16
access = "RW"
reset_value = 0x0000
description = "Configuration register 2"

[config2.fields.rst]
description = "System reset. Set to 1 to reset all registers to default. Self-clears."
base = "bool"
start = 15
end = 16

[config2.fields.acc-rst]
description = "Energy accumulator reset per channel. Bit11=CH4, Bit10=CH3, Bit9=CH2, Bit8=CH1. Bits self-clear after write."
base = "uint"
start = 8
end = 12

[config2.fields.cnvr-mask]
description = "Conversion ready flag on ALERT pin enable"
base = "bool"
start = 7
end = 8

[config2.fields.enof-mask]
description = "Energy overflow alert enable"
base = "bool"
start = 6
end = 7

[config2.fields.alert-latch]
description = "Alert pin latch enable. When set, alert latches until flags register is read."
base = "bool"
start = 5
end = 6

[config2.fields.alert-pol]
description = "Alert pin polarity"
base = "uint"
start = 4
end = 5

[config2.fields.alert-pol.conversion]
name = "alert-polarity"
active-low = 0
active-high = 1

[config2.fields.range]
description = "Shunt full scale input range per channel. Bit3=CH4, Bit2=CH3, Bit1=CH2, Bit0=CH1. 0=±81.92mV, 1=±20.48mV"
base = "uint"
start = 0
end = 4

# ============================================================
# CALIBRATION Registers (per channel)
# ============================================================

[calibration-ch1]
type = "register"
address = 0x05
size_bits = 16
access = "RW"
reset_value = 0x0000
description = "Calibration register channel 1"

[calibration-ch1.fields.shunt-cal]
description = "Shunt calibration value for current conversion"
base = "uint"
start = 0
end = 15

[calibration-ch2]
type = "register"
address = 0x0D
size_bits = 16
access = "RW"
reset_value = 0x0000
description = "Calibration register channel 2"

[calibration-ch2.fields.shunt-cal]
description = "Shunt calibration value for current conversion"
base = "uint"
start = 0
end = 15

[calibration-ch3]
type = "register"
address = 0x15
size_bits = 16
access = "RW"
reset_value = 0x0000
description = "Calibration register channel 3"

[calibration-ch3.fields.shunt-cal]
description = "Shunt calibration value for current conversion"
base = "uint"
start = 0
end = 15

[calibration-ch4]
type = "register"
address = 0x1D
size_bits = 16
access = "RW"
reset_value = 0x0000
description = "Calibration register channel 4"

[calibration-ch4.fields.shunt-cal]
description = "Shunt calibration value for current conversion"
base = "uint"
start = 0
end = 15

# ============================================================
# ALERT_CONFIG Registers (per alert slot)
# ============================================================

[alert-config-1]
type = "register"
address = 0x07
size_bits = 16
access = "RW"
reset_value = 0x0000
description = "Alert configuration register 1"

[alert-config-1.fields.channel]
description = "Channel assignment for this alert"
base = "uint"
start = 3
end = 5

[alert-config-1.fields.channel.conversion]
name = "alert-channel"
ch1 = 0
ch2 = 1
ch3 = 2
ch4 = 3

[alert-config-1.fields.alert-mask]
description = "Active alert function selection"
base = "uint"
start = 0
end = 3

[alert-config-1.fields.alert-mask.conversion]
name = "alert-function"
none = 0
shunt-over-limit = 1
shunt-under-limit = 2
bus-over-limit = 3
bus-under-limit = 4
power-over-limit = 5
reserved-6 = 6
reserved-7 = 7

[alert-config-2]
type = "register"
address = 0x0F
size_bits = 16
access = "RW"
reset_value = 0x0000
description = "Alert configuration register 2"

[alert-config-2.fields.channel]
description = "Channel assignment for this alert"
base = "uint"
start = 3
end = 5


[alert-config-2.fields.alert-mask]
description = "Active alert function selection"
base = "uint"
start = 0
end = 3


[alert-config-3]
type = "register"
address = 0x17
size_bits = 16
access = "RW"
reset_value = 0x0000
description = "Alert configuration register 3"

[alert-config-3.fields.channel]
description = "Channel assignment for this alert"
base = "uint"
start = 3
end = 5


[alert-config-3.fields.alert-mask]
description = "Active alert function selection"
base = "uint"
start = 0
end = 3


[alert-config-4]
type = "register"
address = 0x1F
size_bits = 16
access = "RW"
reset_value = 0x0000
description = "Alert configuration register 4"

[alert-config-4.fields.channel]
description = "Channel assignment for this alert"
base = "uint"
start = 3
end = 5


[alert-config-4.fields.alert-mask]
description = "Active alert function selection"
base = "uint"
start = 0
end = 3


# ============================================================
# ALERT_LIMIT Registers (per alert slot)
# ============================================================

[alert-limit-1]
type = "register"
address = 0x06
size_bits = 16
access = "RW"
reset_value = 0x0000
description = "Alert limit register 1. Format matches corresponding result register."

[alert-limit-1.fields.limit]
description = "Alert threshold. Shunt=signed 16-bit, Bus=unsigned 15-bit, Power=unsigned 16-bit"
base = "uint"
start = 0
end = 16

[alert-limit-2]
type = "register"
address = 0x0E
size_bits = 16
access = "RW"
reset_value = 0x0000
description = "Alert limit register 2"

[alert-limit-2.fields.limit]
description = "Alert threshold"
base = "uint"
start = 0
end = 16

[alert-limit-3]
type = "register"
address = 0x16
size_bits = 16
access = "RW"
reset_value = 0x0000
description = "Alert limit register 3"

[alert-limit-3.fields.limit]
description = "Alert threshold"
base = "uint"
start = 0
end = 16

[alert-limit-4]
type = "register"
address = 0x1E
size_bits = 16
access = "RW"
reset_value = 0x0000
description = "Alert limit register 4"

[alert-limit-4.fields.limit]
description = "Alert threshold"
base = "uint"
start = 0
end = 16

# ============================================================
# SHUNT_VOLTAGE Registers (per channel, read-only)
# ============================================================

[shunt-voltage-ch1]
type = "register"
address = 0x00
size_bits = 16
access = "RO"
description = "Shunt voltage channel 1. 2's complement. LSB = 2.5uV (range=0) or 625nV (range=1)"

[shunt-voltage-ch1.fields.vshunt]
description = "Differential shunt voltage, 2's complement"
base = "uint"
start = 0
end = 16

[shunt-voltage-ch2]
type = "register"
address = 0x08
size_bits = 16
access = "RO"
description = "Shunt voltage channel 2"

[shunt-voltage-ch2.fields.vshunt]
description = "Differential shunt voltage, 2's complement"
base = "uint"
start = 0
end = 16

[shunt-voltage-ch3]
type = "register"
address = 0x10
size_bits = 16
access = "RO"
description = "Shunt voltage channel 3"

[shunt-voltage-ch3.fields.vshunt]
description = "Differential shunt voltage, 2's complement"
base = "uint"
start = 0
end = 16

[shunt-voltage-ch4]
type = "register"
address = 0x18
size_bits = 16
access = "RO"
description = "Shunt voltage channel 4"

[shunt-voltage-ch4.fields.vshunt]
description = "Differential shunt voltage, 2's complement"
base = "uint"
start = 0
end = 16

# ============================================================
# BUS_VOLTAGE Registers (per channel, read-only)
# ============================================================

[bus-voltage-ch1]
type = "register"
address = 0x01
size_bits = 16
access = "RO"
description = "Bus voltage channel 1. Always positive. LSB = 1.6mV"

[bus-voltage-ch1.fields.vbus]
description = "Bus voltage, always positive, 2's complement format"
base = "uint"
start = 0
end = 16

[bus-voltage-ch2]
type = "register"
address = 0x09
size_bits = 16
access = "RO"
description = "Bus voltage channel 2"

[bus-voltage-ch2.fields.vbus]
description = "Bus voltage"
base = "uint"
start = 0
end = 16

[bus-voltage-ch3]
type = "register"
address = 0x11
size_bits = 16
access = "RO"
description = "Bus voltage channel 3"

[bus-voltage-ch3.fields.vbus]
description = "Bus voltage"
base = "uint"
start = 0
end = 16

[bus-voltage-ch4]
type = "register"
address = 0x19
size_bits = 16
access = "RO"
description = "Bus voltage channel 4"

[bus-voltage-ch4.fields.vbus]
description = "Bus voltage"
base = "uint"
start = 0
end = 16

# ============================================================
# CURRENT Registers (per channel, read-only)
# ============================================================

[current-ch1]
type = "register"
address = 0x02
size_bits = 16
access = "RO"
description = "Current channel 1. Value [A] = CURRENT_LSB x register_value"

[current-ch1.fields.current]
description = "Calculated current in amperes, 2's complement"
base = "uint"
start = 0
end = 16

[current-ch2]
type = "register"
address = 0x0A
size_bits = 16
access = "RO"
description = "Current channel 2"

[current-ch2.fields.current]
description = "Calculated current in amperes, 2's complement"
base = "uint"
start = 0
end = 16

[current-ch3]
type = "register"
address = 0x12
size_bits = 16
access = "RO"
description = "Current channel 3"

[current-ch3.fields.current]
description = "Calculated current in amperes, 2's complement"
base = "uint"
start = 0
end = 16

[current-ch4]
type = "register"
address = 0x1A
size_bits = 16
access = "RO"
description = "Current channel 4"

[current-ch4.fields.current]
description = "Calculated current in amperes, 2's complement"
base = "uint"
start = 0
end = 16

# ============================================================
# POWER Registers (per channel, read-only)
# ============================================================

[power-ch1]
type = "register"
address = 0x03
size_bits = 16
access = "RO"
description = "Power channel 1. Value [W] = 32 x CURRENT_LSB x register_value. Unsigned."

[power-ch1.fields.power]
description = "Calculated power in watts, unsigned"
base = "uint"
start = 0
end = 16

[power-ch2]
type = "register"
address = 0x0B
size_bits = 16
access = "RO"
description = "Power channel 2"

[power-ch2.fields.power]
description = "Calculated power in watts, unsigned"
base = "uint"
start = 0
end = 16

[power-ch3]
type = "register"
address = 0x13
size_bits = 16
access = "RO"
description = "Power channel 3"

[power-ch3.fields.power]
description = "Calculated power in watts, unsigned"
base = "uint"
start = 0
end = 16

[power-ch4]
type = "register"
address = 0x1B
size_bits = 16
access = "RO"
description = "Power channel 4"

[power-ch4.fields.power]
description = "Calculated power in watts, unsigned"
base = "uint"
start = 0
end = 16

# ============================================================
# ENERGY Registers (per channel, read-only, 32-bit)
# ============================================================

[energy-ch1]
type = "register"
address = 0x04
size_bits = 32
access = "RO"
description = "Energy channel 1. Value [J] = 32 x CURRENT_LSB x register_value. Unsigned."

[energy-ch1.fields.energy]
description = "Accumulated energy in joules, unsigned"
base = "uint"
start = 0
end = 32

[energy-ch2]
type = "register"
address = 0x0C
size_bits = 32
access = "RO"
description = "Energy channel 2"

[energy-ch2.fields.energy]
description = "Accumulated energy in joules, unsigned"
base = "uint"
start = 0
end = 32

[energy-ch3]
type = "register"
address = 0x14
size_bits = 32
access = "RO"
description = "Energy channel 3"

[energy-ch3.fields.energy]
description = "Accumulated energy in joules, unsigned"
base = "uint"
start = 0
end = 32

[energy-ch4]
type = "register"
address = 0x1C
size_bits = 32
access = "RO"
description = "Energy channel 4"

[energy-ch4.fields.energy]
description = "Accumulated energy in joules, unsigned"
base = "uint"
start = 0
end = 32

# ============================================================
# FLAGS Register (Address = 0x22, read-only)
# ============================================================

[flags]
type = "register"
address = 0x22
size_bits = 16
access = "RO"
reset_value = 0x0000
description = "Flags register"

[flags.fields.limit4-alert]
description = "Alert limit 4 exceeded"
base = "bool"
start = 15
end = 16

[flags.fields.limit3-alert]
description = "Alert limit 3 exceeded"
base = "bool"
start = 14
end = 15

[flags.fields.limit2-alert]
description = "Alert limit 2 exceeded"
base = "bool"
start = 13
end = 14

[flags.fields.limit1-alert]
description = "Alert limit 1 exceeded"
base = "bool"
start = 12
end = 13

[flags.fields.energyof-ch4]
description = "Energy register overflow channel 4"
base = "bool"
start = 11
end = 12

[flags.fields.energyof-ch3]
description = "Energy register overflow channel 3"
base = "bool"
start = 10
end = 11

[flags.fields.energyof-ch2]
description = "Energy register overflow channel 2"
base = "bool"
start = 9
end = 10

[flags.fields.energyof-ch1]
description = "Energy register overflow channel 1"
base = "bool"
start = 8
end = 9

[flags.fields.cvrf]
description = "Conversion ready flag. Set when all conversions and averaging complete. Cleared by writing CONFIG1 or reading FLAGS."
base = "bool"
start = 7
end = 8

[flags.fields.ovf]
description = "Math overflow flag. Indicates current and power data may be invalid."
base = "bool"
start = 6
end = 7

# ============================================================
# MANUFACTURER_ID Register (Address = 0x7E, read-only)
# ============================================================

[manufacturer-id]
type = "register"
address = 0x7E
size_bits = 16
access = "RO"
reset_value = 0x5449
description = "Manufacturer ID. Reads back 0x5449 ('TI' in ASCII)"

[manufacturer-id.fields.id]
description = "Manufacturer ID"
base = "uint"
start = 0
end = 16
